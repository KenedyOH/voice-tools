<script>

function actualizarCore(){

    let core = document.getElementById("core").value;

    document.getElementById("cmdPeer").innerText =
    `show configuration local-policy ${core} short`;

    document.getElementById("cmdIntCore").innerText =
    `show configuration realm-config ${core} short`;
}

function actualizarPeer(){

    let peer = document.getElementById("peer").value;

    document.getElementById("cmdIntPeer").innerText =
    `show configuration realm-config ${peer} short`;

    document.getElementById("cmdIpPeer").innerText =
    `show configuration sip-interface ${peer} short`;
}

function copiar(id){

    let texto =
    document.getElementById(id).innerText;

    navigator.clipboard.writeText(texto);

    mostrarMensaje("✅ Comando copiado");
}

function generarResumen(){

    let numero =
    document.getElementById("numero").value;

    let ipcore =
    document.getElementById("ipcore").value;

    let core =
    document.getElementById("core").value;

    let intcore =
    document.getElementById("intcore").value;

    let ippeer =
    document.getElementById("ippeer").value;

    let peer =
    document.getElementById("peer").value;

    let intpeer =
    document.getElementById("intpeer").value;

    let salida =
`Numeración afectada:
${numero}

IP CORE
${ipcore}
${core}
${intcore}

IP PEER
${ippeer}
${peer}
${intpeer}`;

    document.getElementById("resultado").value =
    salida;
}

function copiarResumen(){

    let texto =
    document.getElementById("resultado").value;

    navigator.clipboard.writeText(texto);

    mostrarMensaje("✅ Resumen copiado");
}

function mostrarMensaje(texto){

    let aviso = document.createElement("div");

    aviso.innerText = texto;

    aviso.style.position = "fixed";
    aviso.style.top = "20px";
    aviso.style.right = "20px";
    aviso.style.background = "#28a745";
    aviso.style.color = "white";
    aviso.style.padding = "12px 18px";
    aviso.style.borderRadius = "8px";
    aviso.style.boxShadow = "0 2px 10px rgba(0,0,0,0.2)";
    aviso.style.fontWeight = "bold";
    aviso.style.zIndex = "9999";

    document.body.appendChild(aviso);

    setTimeout(() => {
        aviso.remove();
    }, 2000);
}

</script>
