<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asistente Voice</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 20px auto;
    padding: 20px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
}

textarea{
    width:100%;
}

button{
    background:#0078D4;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#005ea6;
}

.comando{
    background:#efefef;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
    font-family:consolas;
    word-break: break-word;
}

.oculto{
    display:none;
}
</style>

</head>

<body>

<h1>Asistente Voice</h1>

<div class="card">

<label>Número afectado</label>
<input type="text" id="numero">

<label>IP Core</label>
<input type="text" id="ipcore">

<label>Nombre Core</label>
<input type="text" id="core" onkeyup="actualizarCore()">

</div>

<div class="card">

<h3>Paso 1 - Obtener Peer</h3>

<div id="cmdPeer" class="comando"></div>

<br>

<button onclick="copiar('cmdPeer')">
Copiar comando
</button>

<br><br>

<label>Peer obtenido</label>
<input type="text" id="peer" onkeyup="actualizarPeer()">

</div>

<div class="card">

<h3>Paso 2 - Obtener Interface Core</h3>

<div id="cmdIntCore" class="comando"></div>

<br>

<button onclick="copiar('cmdIntCore')">
Copiar comando
</button>

<br><br>

<label>Interface Core</label>
<input type="text" id="intcore">

</div>

<div class="card">

<h3>Paso 3 - Obtener Interface Peer</h3>

<div id="cmdIntPeer" class="comando"></div>

<br>

<button onclick="copiar('cmdIntPeer')">
Copiar comando
</button>

<br><br>

<label>Interface Peer</label>
<input type="text" id="intpeer">

</div>

<div class="card">

<h3>Paso 4 - Obtener IP Peer</h3>

<div id="cmdIpPeer" class="comando"></div>

<br>

<button onclick="copiar('cmdIpPeer')">
Copiar comando
</button>

<br><br>

<label>IP Peer</label>
<input type="text" id="ippeer">

</div>

<div class="card">

<button onclick="generarResumen()">
Generar Resumen
</button>

</div>

<div class="card">

<h3>Resumen Final</h3>

<textarea id="resultado" rows="15"></textarea>

<br><br>

<button onclick="copiarResumen()">
Copiar Resumen
</button>

</div>

<script>

function actualizarCore(){

let core=document.getElementById("core").value;

document.getElementById("cmdPeer").innerText=
`show configuration local-policy "${core}" short`;

document.getElementById("cmdIntCore").innerText=
`show configuration realm-config "${core}" short`;

}

function actualizarPeer(){

let peer=document.getElementById("peer").value;

document.getElementById("cmdIntPeer").innerText=
`show configuration realm-config "${peer}" short`;

document.getElementById("cmdIpPeer").innerText=
`show configuration sip-interface "${peer}" short`;

}

function copiar(id){

let texto=document.getElementById(id).innerText;

navigator.clipboard.writeText(texto);

alert("Comando copiado");
}

function generarResumen(){

let numero=document.getElementById("numero").value;
let ipcore=document.getElementById("ipcore").value;
let core=document.getElementById("core").value;
let intcore=document.getElementById("intcore").value;

let ippeer=document.getElementById("ippeer").value;
let peer=document.getElementById("peer").value;
let intpeer=document.getElementById("intpeer").value;

let salida=
`Numeración afectada:

${numero}

IP CORE
${ipcore}
${core}
${intcore}

IP PEER
${ippeer}
${peer}
${intpeer}`;

document.getElementById("resultado").value=salida;

}

function copiarResumen(){

let texto=document.getElementById("resultado").value;

navigator.clipboard.writeText(texto);

alert("Resumen copiado");

}

</script>

</body>
</html>
